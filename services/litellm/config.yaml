# Модели добавляются здесь или через UI (/ui → Models; STORE_MODEL_IN_DB=True).
# Список моделей OpenCode Go:
#   curl -H "Authorization: Bearer $OPENCODE_GO_API_KEY" https://opencode.ai/zen/go/v1/models
# Эндпоинт зависит от модели (https://opencode.ai/docs/go):
#   /v1/chat/completions → openai/<id>,    api_base .../zen/go/v1
#   /v1/messages         → anthropic/<id>, api_base .../zen/go   (SDK сам добавляет /v1/messages)
#   /v1/responses        → openai/responses/<id>, api_base .../zen/go/v1
model_list:
  # --- OpenCode Go (подписка) ---
  - model_name: go-kimi-k3
    litellm_params:
      model: openai/kimi-k3
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      # OpenCode шлёт reasoningSummary, провайдеры его не знают и отвечают ошибкой
      additional_drop_params: ["reasoningSummary"]

  # --- OpenRouter ---
  - model_name: or-claude-sonnet
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-4.5
      api_key: os.environ/OPENROUTER_API_KEY
      additional_drop_params: ["reasoningSummary"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  drop_params: true
