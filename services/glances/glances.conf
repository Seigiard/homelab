[load]
careful=1.0
warning=2.0
critical=3.0

[sensors]
# drivetemp gives every SATA disk a temperature but no channel label, so Glances
# numbers them by enumeration order: 0/1 = the RAID1 mirror, 2 = the temporary
# Samsung, 3 = the cold backup disk. Only the mirror is worth watching — the
# other two are hidden rather than aliased.
#
# The numbering is positional, NOT tied to a disk. Pulling any drive renumbers
# the rest, so re-check after touching the bays:
#   curl -s localhost:61208/api/4/sensors | jq -r '.[] | "\(.label) = \(.value)"'
hide=.*Sensor 2.*,drivetemp 2,drivetemp 3
alias=composite:NVMe SSD,package id 0:CPU Package,drivetemp 0:RAID Disk 1,drivetemp 1:RAID Disk 2
