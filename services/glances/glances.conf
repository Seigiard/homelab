[load]
careful=1.0
warning=2.0
critical=3.0

[sensors]
# Glances in web-server mode has no background loop: it collects on request and
# caches for cached_time (1s). Home Assistant polls every 60s (hardcoded in the
# integration), so normally the disks are read once a minute — but an open
# Glances page polls every ~2s, and each poll issues an ATA temperature read to
# every disk. Disk temperature moves over minutes, so that is pure churn.
#
# 10s rather than something larger because fan RPM lives in this same plugin and
# is worth watching live; this only throttles collection, never the API.
refresh=10

# drivetemp gives every SATA disk a temperature but no channel label, so Glances
# numbers them by enumeration order: 0/1 = the RAID1 mirror, 2 = the temporary
# Samsung, 3 = the cold backup disk. Only the mirror is worth watching — the
# other two are hidden rather than aliased.
#
# The numbering follows SATA port order, so it only shifts for disks that sit
# AFTER the one being changed. The mirror occupies the first two ports and is
# therefore stable: pulling the Samsung just moves the backup disk from slot 3
# to slot 2, and both stay hidden. Aliases only need re-checking if a disk is
# added on a lower-numbered port, or the mirror members move between bays:
#   curl -s localhost:61208/api/4/sensors | jq -r '.[] | "\(.label) = \(.value)"'
hide=.*Sensor 2.*,drivetemp 2,drivetemp 3
alias=composite:NVMe SSD,package id 0:CPU Package,drivetemp 0:RAID Disk 1,drivetemp 1:RAID Disk 2
