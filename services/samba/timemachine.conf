# Time Machine shares. docker-compose.yml appends this file to smb.conf via
# `-I`: the `-s` share syntax of dperson/samba cannot carry per-share options,
# and `fruit:time machine max size` must stay per-share, or Finder shows the
# quota as the free space of every share.
#
# `valid users` must match SAMBA_USER_* in .env. Share names must match the
# `adVN=` records in scripts/avahi/timemachine.service.
#
# `max size` is the quota Time Machine sees as the disk size: without it a Mac
# fills the whole RAID before it starts pruning old backups. Raise it here
# and redeploy; Time Machine picks the new size up on the next backup.

[TimeMachine-andrew]
   path = /data/backups/timemachine/andrew
   browsable = yes
   read only = no
   guest ok = no
   valid users = andrew
   ea support = yes
   vfs objects = catia fruit streams_xattr
   fruit:time machine = yes
   fruit:time machine max size = 1T

[TimeMachine-yuliia]
   path = /data/backups/timemachine/yuliia
   browsable = yes
   read only = no
   guest ok = no
   valid users = yuliia
   ea support = yes
   vfs objects = catia fruit streams_xattr
   fruit:time machine = yes
   fruit:time machine max size = 1T
